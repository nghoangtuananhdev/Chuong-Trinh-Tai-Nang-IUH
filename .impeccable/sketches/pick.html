<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Biển chỉ dẫn</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#EEF1F6;color:#0A1A40;padding:28px 64px}
nav{display:flex;justify-content:space-between;align-items:center;height:56px}
nav b{font-size:26px}nav span{background:#153898;color:#fff;padding:12px 22px;border-radius:6px;font-size:22px;font-weight:700}
.wall{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:440px 300px;gap:16px;margin-top:24px}
.sign{background:#153898;color:#fff;border-radius:6px;padding:40px;position:relative;overflow:hidden}
.sign .lt{position:absolute;right:36px;top:24px;font-size:200px;font-weight:900;opacity:.18}
.sign h1{font-size:84px;line-height:1;font-weight:900;letter-spacing:-.02em;max-width:760px}
.sign .chev{display:flex;gap:10px;margin-top:40px}
.sign .chev i{width:70px;height:90px;background:#F9B200;clip-path:polygon(0 15%,50% 0,100% 15%,100% 100%,50% 85%,0 100%)}
.flag{position:absolute;left:0;top:0;width:16px;height:120px;background:#F9B200}
.small h2{font-size:44px;font-weight:900;line-height:1.05}
.light{background:#fff;color:#0A1A40;border:2px solid #153898}
.arrow{font-size:72px;font-weight:900;color:#F9B200}
</style></head><body>
<nav><b>IUH · Xét tuyển tài năng</b><span>Đăng nhập</span></nav>
<div class="wall">
<div class="sign"><span class="flag"></span><span class="lt">A</span><h1>Đợt xét tuyển đang tiếp nhận →</h1><div class="chev"><i></i><i></i><i></i></div></div>
<div class="sign small"><h2>Tra cứu kết quả</h2><p class="arrow">↗</p></div>
<div class="sign small light"><h2>Chưa mở · 1</h2></div>
<div class="sign small"><h2>Đã công bố · 4</h2></div>
</div></body></html>
