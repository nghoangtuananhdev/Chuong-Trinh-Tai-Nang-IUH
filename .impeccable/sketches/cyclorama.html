<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Cyclorama</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:linear-gradient(#05070F 0%,#05070F 38%,#153898 55%,#2F59C4 62%,#F9B200 70%,#FFF7E0 78%,#ffffff 100%);color:#fff}
nav{display:flex;justify-content:space-between;padding:28px 80px;font-size:24px;font-weight:700}
h1{position:absolute;top:150px;left:80px;font-size:92px;line-height:1;font-weight:800;letter-spacing:-.03em}
.bands{position:absolute;left:80px;right:80px;bottom:40px;display:grid;gap:10px}
.band{height:56px;border-radius:4px;display:flex;align-items:center;padding:0 24px;font-size:24px;font-weight:700;color:#05070F;background:rgba(255,255,255,.85)}
.band:nth-child(1){background:rgba(5,7,15,.6);color:#fff}
</style></head><body>
<nav><span>IUH Tài năng</span><span>Đăng nhập</span></nav>
<h1>Từ đêm<br>đến ngày công bố.</h1>
<div class="bands"><div class="band">Nháp</div><div class="band">Đang tiếp nhận</div><div class="band">Đã công bố</div></div>
</body></html>
