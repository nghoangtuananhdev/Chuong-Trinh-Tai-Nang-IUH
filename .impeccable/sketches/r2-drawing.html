<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Bản vẽ</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#F5F8FF;background-image:linear-gradient(#dbe4fb 1px,transparent 1px),linear-gradient(90deg,#dbe4fb 1px,transparent 1px);background-size:32px 32px;color:#0A1A40;padding:28px}
.sheet{position:relative;height:100%;border:4px solid #153898;outline:1px solid #153898;outline-offset:8px;padding:40px 56px}
nav{display:flex;justify-content:space-between;font-size:24px;font-weight:700;color:#153898}
h1{font-size:96px;line-height:1;font-weight:800;letter-spacing:-.03em;margin-top:70px;color:#153898;max-width:900px}
.dim{position:relative;margin-top:70px;width:820px;height:2px;background:#153898}
.dim:before,.dim:after{content:"";position:absolute;top:-16px;width:2px;height:34px;background:#153898}.dim:before{left:0}.dim:after{right:0}
.dim span{position:absolute;left:300px;top:-46px;font-size:26px;font-weight:700;color:#153898;background:#F5F8FF;padding:8px 16px}
.note{margin-top:60px;width:700px;height:64px;border:2px solid #153898}
.title{position:absolute;right:0;bottom:0;width:560px;height:250px;border-left:4px solid #153898;border-top:4px solid #153898;display:grid;grid-template-rows:1fr 1fr 1fr}
.title div{border-bottom:2px solid #153898;padding:16px 24px;font-size:26px;font-weight:700}
.title b{margin:14px 20px;background:#F9B200;border-radius:4px}
</style></head><body><div class="sheet">
<nav><span>IUH · Khoa CNTT</span><span>Đăng nhập</span></nav>
<h1>Xét tuyển Cử nhân &amp; Kỹ sư tài năng</h1>
<div class="dim"><span>Tiếp nhận 01/11 → 30/11</span></div>
<div class="note"></div>
<div class="title"><div>KSTN-KTPM-K22</div><div>Đang tiếp nhận · 30 chỉ tiêu</div><b></b></div>
</div></body></html>
