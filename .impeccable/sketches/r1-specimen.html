<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Bản mẫu chữ</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#F7F8FB;color:#0A1A40;padding:0 72px}
nav{display:flex;justify-content:space-between;align-items:center;height:80px;border-bottom:1px solid #0A1A40}
nav b{font-size:24px}nav span{font-size:22px;font-weight:700;color:#153898}
h1{font-size:260px;line-height:.9;font-weight:900;letter-spacing:-.05em;color:#0A1A40;margin-top:40px}
.axis{display:grid;grid-template-columns:200px 1fr 220px;gap:24px;align-items:center;margin-top:36px}
.axis .lab{font-family:monospace;font-size:22px}
.track{position:relative;height:4px;background:#0A1A40}.track i{position:absolute;left:38%;top:-14px;width:32px;height:32px;border-radius:50%;background:#F9B200;border:3px solid #0A1A40}
.gold{height:4px;background:#F9B200;margin-top:44px;width:38%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:30px;border-top:1px solid #0A1A40}
.grid div{height:140px;border-right:1px solid #0A1A40;padding:18px;font-size:30px;font-weight:700}
.grid div:nth-child(2){background:#153898;color:#fff}
.q{display:flex;gap:12px}.q div{width:520px;height:56px;border:2px solid #0A1A40}.q b{width:200px;height:56px;background:#0A1A40}
</style></head><body>
<nav><b>IUH / Tài năng</b><span>Đăng nhập</span></nav>
<h1>Tài năng</h1>
<div class="axis"><span class="lab">GIAI ĐOẠN</span><div class="track"><i></i></div><span class="lab">03 / 05 ĐỢT</span></div>
<div class="grid"><div>KSTN K22</div><div>KSTN K20</div><div>CNTN K22</div><div>KSTN K21</div></div>
</body></html>
