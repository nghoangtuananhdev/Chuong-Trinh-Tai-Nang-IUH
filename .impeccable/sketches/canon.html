<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Canon</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#F4F6FA;color:#0A1A40}
nav{height:76px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 120px;font-size:24px;font-weight:700}
nav span{background:#153898;color:#fff;padding:10px 20px;border-radius:8px}
.hero{height:380px;background:linear-gradient(90deg,#153898 45%,rgba(21,56,152,.4)),url() #8da8ec;color:#fff;padding:70px 120px}
.hero h1{font-size:64px;font-weight:800}
.hero .s{margin-top:32px;display:flex;gap:12px;width:720px}.hero .s div{flex:1;height:56px;background:#fff;border-radius:8px}.hero .s b{width:180px;height:56px;background:#F9B200;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:40px 120px}
.card{height:300px;background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:24px}
.card h2{font-size:26px}
</style></head><body>
<nav><b>IUH</b><span>Đăng nhập</span></nav>
<div class="hero"><h1>Các đợt xét tuyển</h1><div class="s"><div></div><b></b></div></div>
<div class="grid"><div class="card"><h2>KSTN-KTPM-K22</h2></div><div class="card"><h2>KSTN-KTPM-K20</h2></div><div class="card"><h2>CNTN-MKT-K22</h2></div></div>
</body></html>
