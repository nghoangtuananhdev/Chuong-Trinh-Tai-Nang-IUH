<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Hộ chiếu tài năng</title>
<style>

.pg{position:relative;padding:48px 56px;background:#EEF2FB;background-image:repeating-radial-gradient(circle at 30% 40%,rgba(21,56,152,.07) 0 2px,transparent 2px 9px),repeating-linear-gradient(115deg,rgba(217,164,65,.08) 0 1px,transparent 1px 7px)}

.visa{border:2px solid #153898;border-radius:14px;padding:30px;background:rgba(255,255,255,.7)}
.visa h2{font-size:40px;font-weight:800;color:#0E2466;line-height:1.1}
.visa .btn{margin-top:28px;width:240px;height:60px;border-radius:10px;background:#F9B200}
.stamp{position:absolute;right:70px;top:300px;width:200px;height:200px;border-radius:50%;border:6px double #B3261E;transform:rotate(-12deg);display:grid;place-items:center;color:#B3261E;font-weight:900;font-size:26px;text-align:center}
.stamp2{position:absolute;left:80px;bottom:120px;width:240px;height:110px;border:5px solid #153898;border-radius:12px;transform:rotate(4deg);display:grid;place-items:center;color:#153898;font-weight:900;font-size:26px}
