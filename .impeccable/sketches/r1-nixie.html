<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Nixie</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#0D0F14;color:#E6E8EE;padding:0 80px}
nav{display:flex;justify-content:space-between;align-items:center;height:84px}
nav b{font-size:24px}nav span{background:#F9B200;color:#0D0F14;padding:10px 20px;border-radius:6px;font-size:22px;font-weight:700}
h1{font-size:64px;font-weight:800;letter-spacing:-.02em;margin-top:30px}
.panel{margin-top:40px;background:#1A1E27;border:2px solid #2A2F3A;border-radius:18px;padding:40px;display:flex;gap:18px;justify-content:center}
.tube{width:120px;height:200px;border-radius:60px 60px 18px 18px;background:radial-gradient(circle at 50% 50%,rgba(249,178,0,.35),rgba(20,22,30,.9) 70%);border:2px solid #3A4150;display:grid;place-items:center;font-size:120px;font-weight:300;color:#FFD666;text-shadow:0 0 18px #F9B200}
.sep{font-size:100px;color:#F9B200;align-self:center}
.eng{display:flex;justify-content:center;gap:210px;margin-top:16px;font-size:22px;letter-spacing:.2em;color:#9AA3B5}
.row{display:flex;gap:16px;margin-top:40px}.row div{flex:1;height:110px;border:2px solid #2A2F3A;border-radius:12px;background:#151922}
.btn{margin:30px auto 0;width:300px;height:64px;border-radius:10px;background:#153898;border:3px solid #F9B200}
</style></head><body>
<nav><b>IUH · Tài năng</b><span>Đăng nhập</span></nav>
<h1>Đợt KSTN-KTPM-K22 đóng tiếp nhận sau</h1>
<div class="panel"><div class="tube">1</div><div class="tube">0</div><span class="sep">:</span><div class="tube">0</div><div class="tube">8</div><span class="sep">:</span><div class="tube">4</div><div class="tube">2</div></div>
<div class="eng"><span>NGÀY</span><span>GIỜ</span><span>PHÚT</span></div>
<div class="row"><div></div><div></div><div></div></div>
</body></html>
