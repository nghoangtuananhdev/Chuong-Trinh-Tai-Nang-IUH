<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Sơn mài</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:radial-gradient(70% 60% at 65% 30%,#1a3a9a,#0b1c55 45%,#06102E 80%);color:#fff;padding:0 100px}
nav{display:flex;justify-content:space-between;align-items:center;height:96px;border-bottom:2px solid #C9A227}
nav b{font-size:26px;color:#F9B200}nav span{border:2px solid #C9A227;padding:12px 22px;border-radius:6px;font-size:22px;font-weight:700}
h1{font-size:104px;line-height:1;font-weight:800;letter-spacing:-.03em;margin-top:80px;color:#E9C55A;max-width:1000px}
.q{display:flex;gap:12px;margin-top:48px;width:780px}.q div{flex:1;height:64px;background:rgba(255,255,255,.1);border:2px solid #C9A227;border-radius:8px}.q b{width:220px;height:64px;border-radius:8px;background:#C9A227}
.egg{position:absolute;right:100px;bottom:80px;width:520px;height:250px;border-radius:10px;background:repeating-conic-gradient(from 10deg,#F4F6FA 0 7deg,#d9dde6 7deg 9deg);padding:30px;color:#06102E}
.egg h2{font-size:34px;font-weight:800}.egg b{display:block;margin-top:70px;width:220px;height:56px;border-radius:6px;background:#06102E}
</style></head><body>
<nav><b>IUH</b><span>Đăng nhập</span></nav>
<h1>Tài năng được mài từng lớp.</h1><div class="q"><div></div><b></b></div>
<div class="egg"><h2>KSTN-KTPM-K22 · Đang tiếp nhận</h2><b></b></div>
</body></html>
