<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Hội trường vinh danh</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#071338;color:#fff}
.stage{position:relative;height:640px;background:radial-gradient(60% 70% at 50% 0%,rgba(255,233,168,.55),rgba(249,178,0,.12) 40%,transparent 70%),linear-gradient(#0b1f5c,#071338 80%);overflow:hidden}
.beam{position:absolute;top:-40px;left:50%;width:520px;height:720px;transform:translateX(-50%);background:linear-gradient(rgba(255,233,168,.35),rgba(255,233,168,0) 85%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(6px)}
.drape{position:absolute;top:0;bottom:0;width:120px;background:repeating-linear-gradient(90deg,#06102e 0 18px,#0c1d55 18px 34px)}
.drape.l{left:0}.drape.r{right:0}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 160px}
nav .logo{font-weight:800;font-size:24px}
nav .btn{background:#F9B200;color:#071338;padding:12px 22px;border-radius:999px;font-weight:700;font-size:22px}
.hero{position:absolute;left:0;right:0;top:150px;text-align:center}
.kick{color:#F9B200;font-size:22px;font-weight:700;letter-spacing:.08em}
h1{font-size:96px;line-height:1;font-weight:800;letter-spacing:-.03em;margin-top:18px}
h1 em{font-style:normal;color:#FFE9A8}
.search{margin:44px auto 0;width:760px;display:flex;gap:12px}
.search div{flex:1;height:64px;border-radius:14px;background:rgba(255,255,255,.95)}
.search b{width:200px;height:64px;border-radius:14px;background:#F9B200}
.lip{position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(90deg,transparent,#F9B200 20%,#F9B200 80%,transparent)}
.program{background:#F4F6FA;height:260px;padding:36px 160px;color:#071338}
.program h2{font-size:32px;font-weight:800}
.row{display:grid;grid-template-columns:120px 1fr 260px 180px;gap:24px;align-items:center;border-top:1px solid #cbd3df;padding:18px 0}
.row .t{font-size:28px;font-weight:800;color:#153898}.row .n{font-size:24px;font-weight:700}
.row .cue{height:10px;border-radius:9px;background:linear-gradient(90deg,#153898 60%,#e1e6ee 60%)}
.row .a{height:48px;border-radius:999px;background:#153898}
</style></head><body>
<section class="stage"><div class="drape l"></div><div class="drape r"></div><div class="beam"></div>
<nav><span class="logo">IUH · Tài năng</span><span class="btn">Đăng nhập</span></nav>
<div class="hero"><p class="kick">CỬ NHÂN &amp; KỸ SƯ TÀI NĂNG · 2026–2027</p><h1>Tài năng,<br><em>lên sân khấu.</em></h1>
<div class="search"><div></div><b></b></div></div><div class="lip"></div></section>
<section class="program"><h2>Chương trình các đợt xét tuyển</h2>
<div class="row"><span class="t">01</span><span class="n">Xét tuyển KSTN-KTPM-K22</span><span class="cue"></span><span class="a"></span></div>
<div class="row"><span class="t">02</span><span class="n">Duy trì KSTN-KTPM-K20</span><span class="cue"></span><span class="a"></span></div>
</section></body></html>
