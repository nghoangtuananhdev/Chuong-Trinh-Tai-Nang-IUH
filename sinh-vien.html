<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sinh viên CN/KSTN - Quản lý chương trình CN/KSTN IUH</title>
  <meta name="description" content="Cổng quản lý chương trình Cử nhân tài năng, Kỹ sư tài năng IUH.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/styles/app.css" rel="stylesheet">
</head>
<body data-role="student">
  <div class="app-shell">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <a class="sidebar-brand" href="index.html"><img src="assets/img/logo-iuh-khoa-cntt.svg" alt="IUH - Khoa Công nghệ Thông tin"></a>
      <div class="sidebar-role" id="roleLabel"></div>
      <nav class="sidebar-nav" id="sidebarMenu"></nav>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Mở menu"><i class="bi bi-list"></i></button>
          <div class="page-context"><strong id="pageContext">Tổng quan</strong><br><small>Năm học 2026 - 2027</small></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" data-page="notifications" aria-label="Thông báo"><i class="bi bi-bell"></i><span class="notif-dot"></span></button>
          <div class="dropdown">
            <button class="btn border-0 d-flex align-items-center gap-2 p-1" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="avatar" id="avatar"></span>
              <span class="user-copy text-start"><strong class="d-block small" id="userName"></strong><small class="text-muted" id="userRole"></small></span>
              <i class="bi bi-chevron-down small text-muted"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2">
              <li><a class="dropdown-item rounded-2 py-2" href="#" id="profileLink"><i class="bi bi-person me-2"></i>Thông tin cá nhân</a></li>
              <li><button class="dropdown-item rounded-2 py-2" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="bi bi-key me-2"></i>Đổi mật khẩu</button></li>
              <li><button class="dropdown-item rounded-2 py-2" data-action="recoverPassword"><i class="bi bi-shield-lock me-2"></i>Khôi phục mật khẩu</button></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item rounded-2 py-2 text-danger" href="index.html"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
            </ul>
          </div>
        </div>
      </header>
      <main class="workspace" id="workspace"></main>
    </div>
  </div>

  <div class="modal fade" id="genericModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5 fw-bold" id="genericModalLabel">Thêm mới</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="genericForm"><div class="modal-body" id="genericModalBody"></div><div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" type="submit">Lưu thông tin</button></div></form></div></div></div>
  <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5 fw-bold">Đổi mật khẩu</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="changePasswordForm"><div class="modal-body"><div class="mb-3"><label class="form-label">Mật khẩu hiện tại</label><input class="form-control" type="password" required></div><div class="mb-3"><label class="form-label">Mật khẩu mới</label><input class="form-control" type="password" minlength="8" required><div class="form-text">Tối thiểu 8 ký tự, có chữ hoa, chữ thường và ký tự đặc biệt.</div></div><div><label class="form-label">Xác nhận mật khẩu mới</label><input class="form-control" type="password" minlength="8" required></div></div><div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" type="submit">Đổi mật khẩu</button></div></form></div></div></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
